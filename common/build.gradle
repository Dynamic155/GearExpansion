architectury {
	common rootProject.enabled_platforms.split(',')
}

// Data generation output (models, recipes, tags...). Both loaders get it through this module.
sourceSets.main.resources {
	srcDir 'src/main/generated'
	exclude '.cache/**'
}

dependencies {
	// We depend on Fabric Loader here to use the Fabric @Environment annotations,
	// which get remapped to the correct annotations on each platform.
	// Do NOT use other classes from Fabric Loader.
	implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

	implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

	compileOnly "com.geckolib:geckolib-common-$rootProject.minecraft_version:$rootProject.geckolib_version"

	// YACL has no common artifact. Compile against the Fabric jar and only use its
	// `dev.isxander.yacl3.api` classes, which are identical on both platforms.
	compileOnly("dev.isxander:yet-another-config-lib:$rootProject.yacl_version-fabric") { transitive = false }

	// Optional recipe viewers. Only their loader-independent APIs are used here.
	compileOnly("mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version") { transitive = false }
	compileOnly("me.shedaniel:RoughlyEnoughItems-api:$rootProject.rei_version") { transitive = false }
	// Jade has no separate API jar; its classes are the same on both loaders, so compile against Fabric's.
	compileOnly("maven.modrinth:jade:$rootProject.jade_fabric_version") { transitive = false }
	compileOnly "me.shedaniel.cloth:basic-math:$rootProject.cloth_basic_math_version"
}
