# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version=1.4.0
maven_group=com.gearexpansion
archives_name=gearexpansion
enabled_platforms=fabric,neoforge

# Minecraft properties
minecraft_version=26.3

# Build plugins
loom_version=1.17-SNAPSHOT
architectury_plugin_version=3.5-SNAPSHOT
shadow_version=9.4.3
loom.ignoreDependencyLoomVersionValidation=true

# Loaders
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
neoforge_version=26.3.0.43-beta

# Libraries
architectury_api_version=22.0.3
geckolib_version=5.5.7
yacl_version=3.9.7+26.3
modmenu_version=21.0.0

# Optional recipe viewers. Both are compiled against; recipe_viewer picks which ones the
# development runs (runClient, runGameTest) load: jei, rei, jei,rei, or none.
# Override it on the command line, e.g. ./gradlew :fabric:runClient -Precipe_viewer=rei
jei_version=31.8.0.53
rei_version=26.3.823
# REI's widget API uses Cloth's Point and Rectangle.
cloth_basic_math_version=0.6.1
recipe_viewer=jei

# Optional block info overlay. Development runs always load it. Jade versions differ per loader.
# Jade 26.3.4 crashes on startup on both loaders (a StackOverflowError in its own config loading),
# so develop against the release before it.
jade_fabric_version=26.3.3+fabric
jade_neoforge_version=26.3.1+neoforge

# Optional guidebook. Development runs always load it.
modonomicon_version=2.16.0
