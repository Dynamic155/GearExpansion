plugins {
	// Minecraft 26.x is not obfuscated, so Loom is set up without remapping.
	id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		// Jar names get a platform suffix, e.g. `gearexpansion-fabric-1.0.0.jar`.
		archivesName = "$rootProject.archives_name-$project.name"
	}

	repositories {
		exclusiveContent {
			forRepository {
				maven {
					name = 'GeckoLib'
					url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
				}
			}
			filter {
				includeGroupAndSubgroups('com.geckolib')
			}
		}
		maven {
			name = 'Xander Maven'
			url = 'https://maven.isxander.dev/releases'
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'BlameJared'
					url = 'https://maven.blamejared.com/'
				}
			}
			filter {
				// JEI and its config library.
				includeGroup('mezz.jei')
				includeGroup('net.mezzdev.config')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Shedaniel'
					url = 'https://maven.shedaniel.me/'
				}
			}
			filter {
				// REI and Cloth Config.
				includeGroupAndSubgroups('me.shedaniel')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Modrinth'
					url = 'https://api.modrinth.com/maven'
				}
			}
			filter {
				// Jade.
				includeGroup('maven.modrinth')
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	jar {
		def projectName = rootProject.name
		inputs.property 'projectName', projectName

		from(rootProject.file('LICENSE')) {
			rename { "${it}_$projectName" }
		}
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java
			}
		}
	}
}
