plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	// Files in this configuration are bundled into the mod jar by Shadow.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

dependencies {
	implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
	implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
	implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

	implementation "com.geckolib:geckolib-fabric-$rootProject.minecraft_version:$rootProject.geckolib_version"
	implementation "dev.isxander:yet-another-config-lib:$rootProject.yacl_version-fabric"

	// Optional: adds a settings button in Mod Menu when it's installed.
	compileOnly("com.terraformersmc:modmenu:$rootProject.modmenu_version") { transitive = false }
	localRuntime "com.terraformersmc:modmenu:$rootProject.modmenu_version"

	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

loom {
	runs {
		// Automated in-game checks: ./gradlew :fabric:runGameTest
		gameTest {
			inherit client
			name = 'Game Test'
			vmArg '-Dfabric.client.gametest'
			vmArg '-Dfabric.client.gametest.modid=gearexpansion'
			runDir 'build/gametest'
		}
	}
}

fabricApi {
	configureDataGeneration {
		// The model generator needs the client.
		client = true
		modId = 'gearexpansion'
		outputDirectory.set(rootProject.file('common/src/main/generated'))
		// The common module already ships the generated files.
		addToResources = false
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null
	// Data generators and game tests only run in development.
	exclude 'com/gearexpansion/fabric/datagen/**'
	exclude 'com/gearexpansion/fabric/test/**'
}

assemble.dependsOn shadowJar

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}
